name: Skill Quality

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: skill-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  skill-quality:
    name: Skill Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record tool versions
        run: |
          set -eu
          git --version
          node --version
          python3 --version

      - name: Exercise the gate, including stubbed model execution
        run: bash scripts/test-quality-gate.sh
